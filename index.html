<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Español Juntas — Plataforma de Estudos</title>
<style>
:root{--bg:#f7f5f2;--card:#fff;--ink:#252525;--muted:#777;--accent:#8b5cf6;--accent2:#ec4899;--line:#e9e5df;--ok:#22c55e;--warn:#f59e0b}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#faf7ff,#fff5f8)}
.login-card{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;padding:34px;box-shadow:0 20px 60px #00000010}
.logo{font-size:28px;font-weight:800}.logo span{color:var(--accent)}
.sub{color:var(--muted);margin:8px 0 28px}.role{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}.role button{padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}.role button.active{border-color:var(--accent);background:#f5f0ff;color:var(--accent);font-weight:700}
label{display:block;font-size:13px;font-weight:700;margin:13px 0 7px}input,textarea,select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;outline:none;background:#fff}input:focus,textarea:focus{border-color:var(--accent)}
.primary{width:100%;padding:13px;border-radius:12px;background:var(--accent);color:#fff;font-weight:800;margin-top:16px}.demo{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.5}
.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{background:#fff;border-right:1px solid var(--line);padding:22px 16px;position:sticky;top:0;height:100vh}.brand{font-weight:900;font-size:20px;padding:10px 12px 24px}.brand span{color:var(--accent)}
.nav button{width:100%;text-align:left;background:transparent;padding:12px;border-radius:12px;margin:3px 0;color:#555}.nav button.active,.nav button:hover{background:#f5f0ff;color:var(--accent);font-weight:700}.logout{position:absolute;bottom:20px;left:16px;right:16px;background:#fafafa;padding:11px;border-radius:12px;color:#666}
main{padding:28px;max-width:1300px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.top h1{margin:0;font-size:28px}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#eee5ff;color:#6d28d9;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}.metric b{font-size:28px;display:block;margin-top:6px}.metric small,.muted{color:var(--muted)}.section{margin-top:22px}.section h2{font-size:18px;margin:0 0 12px}.progress{height:9px;background:#eee;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}
.modules{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.module{display:flex;justify-content:space-between;align-items:center}.module h3{margin:0 0 5px}.tag{font-size:12px;padding:5px 8px;border-radius:99px;background:#f3f4f6;color:#555}.tag.ok{background:#eaf9ef;color:#16803c}.tag.lock{background:#f3f3f3;color:#888}
.item{display:flex;justify-content:space-between;gap:15px;align-items:center;border-bottom:1px solid var(--line);padding:14px 0}.item:last-child{border:0}.item h3{margin:0 0 4px;font-size:15px}.btn{padding:9px 12px;border-radius:10px;background:#f5f0ff;color:#6d28d9;font-weight:700}.btn.gray{background:#f3f3f3;color:#555}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}.empty{padding:35px;text-align:center;color:var(--muted)}
.teacher .accent{background:#fff7ed}.teacher .avatar{background:#ffedd5;color:#c2410c}
textarea{min-height:100px;resize:vertical}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toast{position:fixed;right:20px;bottom:20px;background:#222;color:#fff;padding:12px 16px;border-radius:12px;opacity:0;transform:translateY(10px);transition:.2s}.toast.show{opacity:1;transform:none}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.logout{position:static;margin-top:10px}.grid{grid-template-columns:1fr 1fr}.two,.modules{grid-template-columns:1fr}}
@media(max-width:560px){main{padding:18px}.grid{grid-template-columns:1fr}.top h1{font-size:22px}.form-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="login" class="login">
  <div class="login-card">
    <div class="logo">🇪🇸 Español <span>Juntas</span></div>
    <p class="sub">A nossa pequena sala de aula de espanhol.</p>
    <div class="role">
      <button id="studentRole" class="active" onclick="setRole('student')">👩‍🎓 Aluna</button>
      <button id="teacherRole" onclick="setRole('teacher')">👩‍🏫 Professora</button>
    </div>
    <label>Nome</label><input id="name" placeholder="Digite seu nome">
    <label>Senha</label><input id="pass" type="password" placeholder="1234">
    <button class="primary" onclick="loginUser()">Entrar</button>
    <div class="demo">Protótipo gratuito: use qualquer nome e a senha <b>1234</b>.<br>Os dados ficam salvos apenas neste navegador.</div>
  </div>
</div>

<div id="app" class="app hidden">
  <aside class="side">
    <div class="brand">🇪🇸 Español <span>Juntas</span></div>
    <nav class="nav" id="nav"></nav>
    <button class="logout" onclick="logout()">Sair</button>
  </aside>
  <main>
    <div class="top"><h1 id="pageTitle">Início</h1><div class="avatar" id="avatar">A</div></div>
    <div id="content"></div>
  </main>
</div>
<div id="toast" class="toast"></div>

<script>
const state={role:'student',name:'',page:'home'};
let data=JSON.parse(localStorage.getItem('ej_data')||'null')||{
 progress:35, streak:4, points:420,
 modules:[
  {id:1,title:'Módulo 1 — Introducción',desc:'Saudações, apresentações e frases essenciais.',progress:100,status:'Concluído'},
  {id:2,title:'Módulo 2 — La vida cotidiana',desc:'Rotina, família, horários e vocabulário.',progress:55,status:'Em andamento'},
  {id:3,title:'Módulo 3 — Conversación',desc:'Prática oral e situações do dia a dia.',progress:0,status:'Próximo'},
  {id:4,title:'Módulo 4 — Gramática',desc:'Verbos, pronomes e construção de frases.',progress:0,status:'Bloqueado'}
 ],
 tasks:[
  {title:'Exercício: Mi rutina',due:'22/08',status:'Pendente'},
  {title:'Áudio: Me presento',due:'25/08',status:'Pendente'},
  {title:'Quiz — Verbos ser/estar',due:'28/08',status:'Concluído'}
 ],
 vocab:[['hola','olá'],['gracias','obrigada'],['todavía','ainda'],['aprender','aprender']]
};
function save(){localStorage.setItem('ej_data',JSON.stringify(data))}
function setRole(r){state.role=r;studentRole.classList.toggle('active',r==='student');teacherRole.classList.toggle('active',r==='teacher')}
function loginUser(){
 if(pass.value!=='1234'){toast('Senha de demonstração: 1234');return}
 state.name=name.value.trim()|| (state.role==='teacher'?'Professora':'Aluna');
 login.classList.add('hidden');app.classList.remove('hidden');document.querySelector('.side').classList.toggle('teacher',state.role==='teacher');avatar.textContent=state.name[0].toUpperCase();buildNav();render();
}
function logout(){app.classList.add('hidden');login.classList.remove('hidden')}
function buildNav(){
 const items=state.role==='teacher'
 ? [['home','🏠','Painel'],['lessons','📚','Aulas'],['tasks','📝','Atividades'],['student','👩‍🎓','Minha aluna'],['notes','💬','Feedback']]
 : [['home','🏠','Início'],['lessons','📚','Aulas'],['tasks','📝','Tarefas'],['vocab','🧠','Vocabulário'],['progress','📊','Meu progresso']];
 nav.innerHTML=items.map(x=>`<button class="${state.page===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]} ${x[2]}</button>`).join('');
}
function go(p){state.page=p;buildNav();render()}
function render(){
 const titles={home:state.role==='teacher'?'Painel da professora':'Olá, '+state.name+'! 👋',lessons:'Aulas',tasks:'Atividades',student:'Minha aluna',notes:'Feedback',vocab:'Vocabulário',progress:'Meu progresso'};
 pageTitle.textContent=titles[state.page]||'Español Juntas';
 content.innerHTML=views[state.page]();
}
const views={
 home:()=>state.role==='teacher'?teacherHome():studentHome(),
 lessons:()=>`<div class="section"><h2>${state.role==='teacher'?'Gerencie o conteúdo':'Conteúdo do curso'}</h2><div class="modules">${data.modules.map(m=>`<div class="card module"><div><h3>${m.title}</h3><div class="muted">${m.desc}</div><div class="progress" style="margin-top:12px"><i style="width:${m.progress}%"></i></div></div><span class="tag ${m.status==='Concluído'?'ok':''}">${m.status}</span></div>`).join('')}</div>${state.role==='teacher'?`<div class="section"><button class="btn" onclick="addModule()">＋ Criar módulo</button></div>`:''}</div>`,
 tasks:()=>`<div class="card">${data.tasks.map((t,i)=>`<div class="item"><div><h3>${t.title}</h3><span class="muted">Prazo: ${t.due}</span></div><span class="tag ${t.status==='Concluído'?'ok':''}">${t.status}</span></div>`).join('')}</div>${state.role==='teacher'?`<div class="section"><button class="btn" onclick="addTask()">＋ Criar atividade</button></div>`:''}`,
 vocab:()=>`<div class="card"><div class="item"><div><b>Espanhol</b></div><div><b>Português</b></div></div>${data.vocab.map(v=>`<div class="item"><div>${v[0]}</div><div>${v[1]}</div></div>`).join('')}</div><div class="section"><button class="btn" onclick="addVocab()">＋ Adicionar palavra</button></div>`,
 progress:()=>`<div class="grid"><div class="card metric">📈<small>Progresso</small><b>${data.progress}%</b></div><div class="card metric">🔥<small>Sequência</small><b>${data.streak} dias</b></div><div class="card metric">⭐<small>Pontos</small><b>${data.points}</b></div><div class="card metric">📚<small>Módulos</small><b>2/4</b></div></div><div class="section two"><div class="card"><h2>Progresso geral</h2><div class="progress"><i style="width:${data.progress}%"></i></div><p class="muted">${data.progress}% do curso concluído.</p></div><div class="card"><h2>Próxima meta</h2><p>Concluir o Módulo 2 e enviar o áudio “Me presento”.</p></div></div>`,
 student:()=>`<div class="grid"><div class="card metric">👩‍🎓<small>Aluna</small><b>${state.name}</b></div><div class="card metric">📈<small>Progresso</small><b>${data.progress}%</b></div><div class="card metric">🔥<small>Sequência</small><b>${data.streak} dias</b></div><div class="card metric">⭐<small>Pontos</small><b>${data.points}</b></div></div><div class="section card"><h2>Últimas atividades</h2>${data.tasks.map(t=>`<div class="item"><div><h3>${t.title}</h3><span class="muted">${t.due}</span></div><span class="tag ${t.status==='Concluído'?'ok':''}">${t.status}</span></div>`).join('')}</div>`,
 notes:()=>`<div class="card"><h2>Feedback para ${state.name}</h2><textarea id="feedback" placeholder="Escreva aqui observações sobre pronúncia, gramática, vocabulário..."></textarea><button class="btn" style="margin-top:12px" onclick="sendFeedback()">Salvar feedback</button></div><div class="section card"><h2>Histórico</h2><div class="empty">Nenhum feedback salvo ainda.</div></div>`
};
function studentHome(){return `<div class="grid"><div class="card metric">📈<small>Progresso</small><b>${data.progress}%</b></div><div class="card metric">🔥<small>Sequência</small><b>${data.streak} dias</b></div><div class="card metric">⭐<small>Pontos</small><b>${data.points}</b></div><div class="card metric">📝<small>Tarefas</small><b>${data.tasks.filter(x=>x.status==='Pendente').length}</b></div></div><div class="section two"><div class="card"><h2>Continue estudando</h2><h3>Módulo 2 — La vida cotidiana</h3><p class="muted">Rotina, família, horários e vocabulário.</p><div class="progress"><i style="width:55%"></i></div><button class="btn" style="margin-top:14px" onclick="go('lessons')">Abrir aula</button></div><div class="card"><h2>Próxima tarefa</h2><h3>Exercício: Mi rutina</h3><p class="muted">Entrega até 22/08</p><button class="btn" onclick="go('tasks')">Ver tarefas</button></div></div><div class="section card"><h2>💡 Frase do dia</h2><p style="font-size:20px">“Poco a poco se llega lejos.”</p><p class="muted">Pouco a pouco se chega longe.</p></div>`}
function teacherHome(){return `<div class="grid"><div class="card metric">👩‍🎓<small>Alunas</small><b>1</b></div><div class="card metric">📚<small>Módulos</small><b>4</b></div><div class="card metric">📝<small>Tarefas</small><b>${data.tasks.length}</b></div><div class="card metric">📈<small>Progresso</small><b>${data.progress}%</b></div></div><div class="section two"><div class="card"><h2>Progresso de ${state.name}</h2><div class="progress"><i style="width:${data.progress}%"></i></div><p>${data.progress}% concluído</p><button class="btn" onclick="go('student')">Ver perfil</button></div><div class="card"><h2>Atalhos</h2><button class="btn" onclick="addModule()">＋ Nova aula</button> <button class="btn" onclick="addTask()">＋ Nova tarefa</button></div></div>`}
function addModule(){let t=prompt('Nome do módulo:');if(!t)return;data.modules.push({id:Date.now(),title:t,desc:'Novo conteúdo de espanhol.',progress:0,status:'Próximo'});save();render();toast('Módulo criado!')}
function addTask(){let t=prompt('Nome da atividade:');if(!t)return;data.tasks.unshift({title:t,due:'Definir',status:'Pendente'});save();render();toast('Atividade criada!')}
function addVocab(){let a=prompt('Palavra em espanhol:');let b=prompt('Tradução:');if(a&&b){data.vocab.push([a,b]);save();render();toast('Palavra adicionada!')}}
function sendFeedback(){if(!feedback.value.trim())return toast('Escreva um feedback primeiro.');toast('Feedback salvo!')}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
</script>
</body></html>
